<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Team Expenses - Expense Tracker</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div class="dashboard-container">


        <!-- ============================= -->
        <!-- TEAM HEADER -->
        <!-- ============================= -->

        <div class="dashboard-header">

            <div>

                <h1>
                    Daily Expenses
                </h1>

                <p>
                    View-only access
                </p>

            </div>

        </div>



        <!-- ============================= -->
        <!-- SUMMARY CARDS -->
        <!-- ============================= -->

        <div class="summary-cards">


            <!-- TOTAL EXPENSES -->

            <div class="summary-card">

                <div class="card-icon">
                    💰
                </div>

                <div>

                    <p>
                        Total Expenses
                    </p>

                    <h2 id="teamTotalExpense">
                        ₹0.00
                    </h2>

                </div>

            </div>



            <!-- TOTAL ENTRIES -->

            <div class="summary-card">

                <div class="card-icon">
                    🧾
                </div>

                <div>

                    <p>
                        Total Entries
                    </p>

                    <h2 id="teamTotalEntries">
                        0
                    </h2>

                </div>

            </div>


        </div>



        <!-- ============================= -->
        <!-- DAILY EXPENSES -->
        <!-- ============================= -->

        <div class="expenses-section">

            <h2>
                Daily Expenses
            </h2>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Date
                            </th>

                            <th>
                                Purpose
                            </th>

                            <th>
                                Amount
                            </th>

                            <th>
                                Paid By
                            </th>

                            <th>
                                Balance Amount
                            </th>

                        </tr>

                    </thead>


                    <tbody id="expenseTableBody">

                    </tbody>

                </table>

            </div>

        </div>


    </div>



    <!-- ============================= -->
    <!-- SUPABASE -->
    <!-- ============================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- ============================= -->
    <!-- MAIN JAVASCRIPT -->
    <!-- ============================= -->

    <script src="script.js"></script>


</body>

</html>
