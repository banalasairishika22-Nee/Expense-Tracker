<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Team Expenses - Expense Tracker</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div class="dashboard-container">


        <!-- ============================= -->
        <!-- TEAM HEADER -->
        <!-- ============================= -->

        <div class="dashboard-header">

            <div>

                <h1>
                    Daily Expenses
                </h1>

                <p>
                    View-only access
                </p>

            </div>


            <button
                id="downloadPdfBtn"
                type="button"
            >
                📄 Download PDF
            </button>

        </div>



        <!-- ============================= -->
        <!-- EXPENSES -->
        <!-- ============================= -->

        <div class="expenses-section">

            <h2>
                Daily Expenses
            </h2>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Date
                            </th>

                            <th>
                                Purpose
                            </th>

                            <th>
                                Amount
                            </th>

                            <th>
                                Paid By
                            </th>

                            <th>
                                Balance Amount
                            </th>

                        </tr>

                    </thead>


                    <tbody id="expenseTableBody">

                        <!-- Expenses will appear here -->

                    </tbody>

                </table>

            </div>

        </div>


    </div>



    <!-- ============================= -->
    <!-- SUPABASE -->
    <!-- ============================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- ============================= -->
    <!-- MAIN JAVASCRIPT -->
    <!-- ============================= -->

    <script src="script.js"></script>


</body>

</html>
