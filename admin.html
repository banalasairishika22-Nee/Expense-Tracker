<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard - Expense Tracker</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div class="dashboard-container">


        <!-- ============================= -->
        <!-- ADMIN HEADER -->
        <!-- ============================= -->

        <div class="dashboard-header">

            <div>

                <h1>
                    Admin Dashboard
                </h1>

                <p>
                    Manage Daily Expenses
                </p>

            </div>


            <div class="header-buttons">

                <button
                    id="downloadPdfBtn"
                    type="button"
                >
                    📄 Download PDF
                </button>


                <button
                    id="logoutBtn"
                    type="button"
                >
                    Logout
                </button>

            </div>

        </div>



        <!-- ============================= -->
        <!-- SUMMARY CARDS -->
        <!-- ============================= -->

        <div class="summary-cards">


            <!-- TOTAL EXPENSES -->

            <div class="summary-card">

                <div class="card-icon">
                    💰
                </div>

                <div>

                    <p>
                        Total Expenses
                    </p>

                    <h2 id="totalExpense">
                        ₹0.00
                    </h2>

                </div>

            </div>



            <!-- TOTAL BALANCE -->

            <div class="summary-card">

                <div class="card-icon">
                    💵
                </div>

                <div>

                    <p>
                        Total Balance
                    </p>

                    <h2 id="totalBalance">
                        ₹0.00
                    </h2>

                </div>

            </div>



            <!-- TOTAL ENTRIES -->

            <div class="summary-card">

                <div class="card-icon">
                    🧾
                </div>

                <div>

                    <p>
                        Total Entries
                    </p>

                    <h2 id="totalEntries">
                        0
                    </h2>

                </div>

            </div>


        </div>



        <!-- ============================= -->
        <!-- ADD EXPENSE -->
        <!-- ============================= -->

        <div class="expense-form-container">

            <h2>
                Add Expense
            </h2>


            <form id="expenseForm">


                <!-- DATE -->

                <label for="expenseDate">
                    Date
                </label>

                <input
                    type="date"
                    id="expenseDate"
                    required
                >



                <!-- PURPOSE -->

                <label for="purpose">
                    Purpose
                </label>

                <input
                    type="text"
                    id="purpose"
                    placeholder="Enter purpose"
                    required
                >



                <!-- AMOUNT -->

                <label for="amount">
                    Amount
                </label>

                <input
                    type="number"
                    id="amount"
                    placeholder="Enter amount"
                    min="0"
                    step="0.01"
                    required
                >



                <!-- PAID BY -->

                <label for="paidBy">
                    Paid By
                </label>

                <input
                    type="text"
                    id="paidBy"
                    placeholder="Enter paid by"
                    required
                >



                <!-- BALANCE -->

                <label for="balanceAmount">
                    Balance Amount
                </label>

                <input
                    type="number"
                    id="balanceAmount"
                    placeholder="Enter balance amount"
                    min="0"
                    step="0.01"
                    required
                >



                <!-- ADD BUTTON -->

                <button
                    type="submit"
                >
                    Add Expense
                </button>


            </form>


            <p
                id="expenseMessage"
            ></p>


        </div>



        <!-- ============================= -->
        <!-- DAILY EXPENSES -->
        <!-- ============================= -->

        <div class="expenses-section">


            <h2>
                Daily Expenses
            </h2>


            <div class="table-container">


                <table>


                    <thead>

                        <tr>

                            <th>
                                Date
                            </th>

                            <th>
                                Purpose
                            </th>

                            <th>
                                Amount
                            </th>

                            <th>
                                Paid By
                            </th>

                            <th>
                                Balance Amount
                            </th>

                            <th>
                                Daily Total
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>


                    <tbody
                        id="adminExpenseTableBody"
                    >

                    </tbody>


                </table>


            </div>


        </div>


    </div>



    <!-- ============================= -->
    <!-- SUPABASE -->
    <!-- ============================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>



    <!-- ============================= -->
    <!-- MAIN JAVASCRIPT -->
    <!-- ============================= -->

    <script src="script.js"></script>


</body>

</html>
